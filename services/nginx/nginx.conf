# Standalone, rootless nginx config that fronts the harness stack.
#
# Run it (from anywhere) with the sibling Makefile, or directly:
#   nginx -p services/nginx -c nginx.conf
#
# All relative paths below resolve against the prefix passed via `-p`.
#
#   http://<lan-ip>:6060/harness/      -> ui/harness   (Vite on :6001)
#   http://<lan-ip>:6060/harness/api/  -> services/harness (Express API on :6000)
#   http://<lan-ip>:6060/api/          still works for machine-to-machine calls.
#   /api/terminal -> :6003, /api/editor -> :6004, /api/git -> :6005, /api/memory -> :6008
#   http://localhost:6060/      also works. Upstreams stay loopback.
#   http://<lan-ip>:6060/m/<machine>/... -> that machine's nginx (see machines.json)

worker_processes 1;
pid nginx.pid;
daemon off;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # Keep every writable path inside the prefix so nginx needs no root.
    client_body_temp_path tmp/client_body;
    proxy_temp_path        tmp/proxy;
    fastcgi_temp_path      tmp/fastcgi;
    uwsgi_temp_path        tmp/uwsgi;
    scgi_temp_path         tmp/scgi;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    default_type application/octet-stream;
    client_max_body_size 16m;

    # Vite HMR is a WebSocket on /. Only upgrade when the client asks.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstreams. Override the ports here if you change service/UI defaults.
    upstream harness_api {
        server 127.0.0.1:6000;
    }
    upstream terminal_api {
        server 127.0.0.1:6003;
    }
    upstream editor_api {
        server 127.0.0.1:6004;
    }
    upstream git_api {
        server 127.0.0.1:6005;
    }
    upstream memory_api {
        server 127.0.0.1:6008;
    }
    upstream harness_ui {
        server 127.0.0.1:6001;
    }

    # $machine_host / $machine_path maps, rendered from machines.json.
    include machines.conf;

    server {
        listen 0.0.0.0:6060 default_server;
        listen [::]:6060 default_server;
        server_name _;
        absolute_redirect off;

        # The UI lives under /harness/ so it can share a host with other apps.
        # Its backend calls carry the prefix; strip it so the locations below match.
        rewrite ^/harness(/(?:api|m)(?:/.*)?|/machines\.json)$ $1 last;

        location = / {
            return 302 /harness/;
        }

        location = /harness {
            return 301 /harness/;
        }

        location = /machines.json {
            default_type application/json;
            add_header Cache-Control no-store;
            alias machines.public.json;
        }

        # Every machine runs the same stack, so /m/<machine>/api/... goes to
        # that machine's nginx, which fans out to its harness/terminal/editor/git.
        location ~ ^/m/[A-Za-z0-9_-]+/ {
            if ($machine_host = "") {
                return 404;
            }
            proxy_pass http://$machine_host$machine_path;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }

        # Boundary matches include bare endpoints without redirecting POSTs.
        location ~ ^/api/terminal(?:/|$) {
            proxy_pass http://terminal_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_buffering off;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }

        location ~ ^/api/editor(?:/|$) {
            proxy_pass http://editor_api;
            proxy_http_version 1.1;
            client_max_body_size 16m;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Push/pull/fetch can wait on the network, so allow long reads.
        location ~ ^/api/git(?:/|$) {
            proxy_pass http://git_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 10m;
        }

        location ~ ^/api/memory(?:/|$) {
            proxy_pass http://memory_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # API + Server-Sent Events. SSE needs buffering off and long timeouts.
        location /api/ {
            proxy_pass http://harness_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://harness_ui;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}
