# Standalone, rootless nginx config that fronts the harness stack.
#
# Run it (from anywhere) with the sibling Makefile, or directly:
#   nginx -p services/nginx -c nginx.conf
#
# All relative paths below resolve against the prefix passed via `-p`.
#
#   http://<lan-ip>:6060/        -> ui/harness   (Vite on :6001)
#   http://<lan-ip>:6060/api/    -> services/harness (Express API on :6000)
#   http://localhost:6060/      also works. Upstreams stay loopback.

worker_processes 1;
pid nginx.pid;
daemon off;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # Keep every writable path inside the prefix so nginx needs no root.
    client_body_temp_path tmp/client_body;
    proxy_temp_path        tmp/proxy;
    fastcgi_temp_path      tmp/fastcgi;
    uwsgi_temp_path        tmp/uwsgi;
    scgi_temp_path         tmp/scgi;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    default_type application/octet-stream;
    client_max_body_size 16m;

    # Vite HMR is a WebSocket on /. Only upgrade when the client asks.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstreams. Override the ports here if you change service/UI defaults.
    upstream harness_api {
        server 127.0.0.1:6000;
    }
    upstream terminal_api {
        server 127.0.0.1:6003;
    }
    upstream editor_api {
        server 127.0.0.1:6004;
    }
    upstream git_api {
        server 127.0.0.1:6005;
    }
    upstream harness_ui {
        server 127.0.0.1:6001;
    }

    server {
        listen 0.0.0.0:6060 default_server;
        listen [::]:6060 default_server;
        server_name _;

        # Boundary matches include bare endpoints without redirecting POSTs.
        location ~ ^/api/terminal(?:/|$) {
            proxy_pass http://terminal_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_buffering off;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }

        location ~ ^/api/editor(?:/|$) {
            proxy_pass http://editor_api;
            proxy_http_version 1.1;
            client_max_body_size 16m;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Push/pull/fetch can wait on the network, so allow long reads.
        location ~ ^/api/git(?:/|$) {
            proxy_pass http://git_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 10m;
        }

        # API + Server-Sent Events. SSE needs buffering off and long timeouts.
        location /api/ {
            proxy_pass http://harness_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://harness_ui;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}
